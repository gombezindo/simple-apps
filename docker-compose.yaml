services:
  backend:
    build: ./apps
    restart: always
    links:
      - db
    ports:
      - "3000:3000"
    environment:
      - DB_HOST=db
      - DB_PORT=3306
      - DB_USER=peserta
      - DB_PASSWORD=password
      - DB_NAME=training
    volumes:
      - app-data:/apps/public/images

  db:
    image: mariadb
    restart: always
    links:
      - phpmyadmin
    ports:
      - "3306:3306"
    environment:
      - MYSQL_ROOT_PASSWORD=password
      - MYSQL_DATABASE=training
      - MYSQL_USER=peserta
      - MYSQL_PASSWORD=password
    volumes:
      - db-data:/var/lib/mysql
      - ./apps/database/:/docker-entrypoint-initdb.d/
  
  phpmyadmin:
    image: phpmyadmin/phpmyadmin
    restart: always
    links:
      - db
    ports:
      - "8080:80"
    environment:
      - PMA_HOST=db
      - PMA_PORT=3306
  
  web:
    build: ./nginx
    restart: always
    links:
      - backend
    ports:
      - "80:80"
    depends_on:
      - backend

volumes:
  app-data:
  db-data: